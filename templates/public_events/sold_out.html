{% extends 'layouts/base.html' %}

{% block title %}Sold Out{% endblock %}

{% block content %}

<div class="container text-center py-5">

    <h1 class="text-danger">

        Event Sold Out

    </h1>

    <p>

        Sorry!

        All tickets for

        <strong>{{ event.title }}</strong>

        have been booked.

    </p>

    <a href="{% url 'public_events' %}"
       class="btn btn-warning">

        View Other Events

    </a>

</div>

{% endblock %}
